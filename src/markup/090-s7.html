  <!-- S7 꾸미기 -->
  <section class="screen" id="s7">
    <div class="decor">
      <div class="decor-left">
        <div class="bar"><i id="bar"></i></div>
        <div class="stage">
          <canvas class="decor-canvas" id="decor-canvas"></canvas>
          <!-- 스티커를 누르면 나오는 도구: 작게 · 크게 · 왼쪽 회전 · 오른쪽 회전 · 지우기 -->
          <div id="stool" role="toolbar" aria-label="스티커 도구">
            <button data-op="shrink" aria-label="작게">－</button>
            <button data-op="grow" aria-label="크게">＋</button>
            <button data-op="rotl" aria-label="왼쪽으로 돌리기">↺</button>
            <button data-op="rotr" aria-label="오른쪽으로 돌리기">↻</button>
            <button data-op="del" class="del" aria-label="지우기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </div>
        <div class="row">
          <button class="btn" id="btn-decor-ok">다 꾸몄어요!</button>
        </div>
      </div>
      <div class="drawer" id="drawer">
        <div class="tools">
          <button class="btn sec tiny" id="btn-undo"><svg class="ic" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18H32a8 8 0 0 1 0 16H20"/><path d="M20 11l-7 7 7 7"/></svg> 되돌리기</button>
          <button class="btn sec tiny" id="btn-clear"><svg class="ic" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13h32"/><path d="M18 13V8h12v5"/><path d="M12 13l2 28h20l2-28"/><path d="M20 21v13M28 21v13"/></svg> 전체 지우기</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="sgrid" id="sgrid"></div>
        <div class="full-note" id="full-note"></div>
      </div>
    </div>
    <button class="btn corner" data-go="s6" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </section>
